spring.application.name=campaign-ai-builder

# Active profile: local (Ollama) | cloud (OpenAI)
# Override via: export SPRING_PROFILES_ACTIVE=cloud
spring.profiles.active=local

# Lego Campaign API (shared across all profiles)
campaign.api.lego.base-url=${CAMPAIGN_API_BASE_URL:https://your-campaign-api-base-url}
# Set via environment variable: export CAMPAIGN_API_BASE_URL=https://...
campaign.api.lego.api-prefix=/api/v2
